title: "Journalisation CloudTrail arrêtée ou modifiée"
id: "003"
status: "experimental"
description: "Effacement des traces : arrêt, suppression ou réduction du périmètre d'un trail."
author: "adl"
date: "2026-10-05"
tags:
  - "attack.defense-evasion"
  - "attack.t1562.008"
logsource:
  product: "aws"
  service: "cloudtrail"
detection:
  selection:
    eventSource: "cloudtrail.amazonaws.com"
    eventName:
      - "StopLogging"
      - "DeleteTrail"
      - "UpdateTrail"
      - "PutEventSelectors"
      - "PutInsightSelectors"
  condition: "selection"
falsepositives:
  - "Changement planifié par un administrateur"
level: "critical"
