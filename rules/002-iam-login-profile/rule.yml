title: "Profil de connexion console créé ou modifié"
id: "002"
status: "experimental"
description: "Prise de contrôle d'un compte : mot de passe console défini sans passer par le circuit normal."
author: "adl"
date: "2026-10-05"
tags:
  - "attack.persistence"
  - "attack.privilege-escalation"
  - "attack.t1098"
logsource:
  product: "aws"
  service: "cloudtrail"
detection:
  selection:
    eventSource: "iam.amazonaws.com"
    eventName:
      - "CreateLoginProfile"
      - "UpdateLoginProfile"
  condition: "selection"
falsepositives:
  - "Changement planifié par un administrateur"
level: "high"
